<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Craft - Loja Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #8b5cf6; --border-light: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: #f9fafb; }
        
        /* Painel Admin Ajustado para altura do ecrã */
        .admin-content {
            background: #fff;
            padding: 28px;
            border-radius: 12px;
            width: 90%;
            max-width: 520px;
            max-height: 90vh; /* Ajuste para caber no ecrã */
            overflow-y: auto; /* Permite scroll se necessário */
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 1px solid var(--border-light);
            position: relative;
        }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <!-- Header & Catalog -->
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-8 cursor-pointer" onclick="toggleAdminPanel()">Dream Craft</h1>
        <div id="catalog" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cart-drawer" class="fixed right-0 top-0 h-full w-80 bg-white shadow-xl p-6 hidden overflow-y-auto z-50">
        <h2 class="text-xl font-bold mb-4">O seu Carrinho</h2>
        <div id="cart-items"></div>
        <div id="cart-total" class="mt-6 font-bold text-lg"></div>
        <button onclick="toggleCheckout()" class="w-full bg-purple-600 text-white py-3 rounded-lg mt-4">Finalizar Encomenda</button>
        <button onclick="toggleCart()" class="w-full text-gray-500 mt-2">Fechar</button>
    </div>

    <!-- Checkout Form (Modal) -->
    <div id="checkout-form-box" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Dados de Entrega</h2>
            <input type="text" id="client-name" placeholder="O seu Nome Completo" class="w-full mb-3 p-2 border rounded">
            <input type="tel" id="client-phone" placeholder="O seu Telemóvel" class="w-full mb-3 p-2 border rounded">
            <select id="delivery-method" onchange="handleDeliveryChange()" class="w-full mb-3 p-2 border rounded">
                <option value="Levantamento">Levantamento (Loja)</option>
                <option value="Entrega ao Domicilio">Entrega ao Domicílio</option>
            </select>
            <input type="text" id="client-address" placeholder="Morada completa" class="w-full mb-3 p-2 border rounded hidden">
            <button onclick="processCheckout()" class="w-full bg-green-600 text-white py-3 rounded-lg">Enviar Encomenda</button>
            <button onclick="toggleCheckout()" class="w-full text-gray-500 mt-2">Cancelar</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="admin-content">
            <h2 class="text-xl font-bold mb-4">Painel Administrativo</h2>
            <input type="password" id="admin-pass" placeholder="Palavra-passe" class="w-full p-2 border rounded mb-4">
            <button onclick="checkAdmin()" class="w-full bg-gray-800 text-white py-2 rounded">Entrar</button>
            <button onclick="toggleAdminPanel()" class="w-full mt-2 text-gray-500">Fechar</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxx35AAN_QFqaLVnMHqzr5ppnUn9iq37go2AI7UqnzajlR1SSf7usY39gX6NfY898aZ/exec";
        const MY_PHONE_NUMBER = "351912345678";
        const ADMIN_EMAIL = "catiapaiva75@gmail.com";
        const HOME_DELIVERY_FEE = 2;

        let cart = [];
        let failedAttempts = 0;

        async function loadCatalog() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                renderCatalog(data);
            } catch(e) {
                renderCatalog([
                    {Nome: "Vela Lavanda", Preco: 8.50, Imagem: "https://placehold.co/300x300/8b5cf6/white?text=Vela"},
                    {Nome: "Pulseira", Preco: 5.00, Imagem: "https://placehold.co/300x300/8b5cf6/white?text=Pulseira"}
                ]);
            }
        }

        function renderCatalog(items) {
            const container = document.getElementById('catalog');
            container.innerHTML = items.map(i => `
                <div class="border rounded-lg p-4 text-center">
                    <img src="${i.Imagem}" class="w-full h-48 object-cover rounded mb-2">
                    <h3 class="font-bold">${i.Nome}</h3>
                    <p>${i.Preco}€</p>
                    <button onclick="addToCart('${i.Nome}', ${i.Preco})" class="bg-purple-600 text-white px-4 py-2 mt-2 rounded">Adicionar</button>
                </div>`).join('');
        }

        function addToCart(name, price) {
            cart.push({name, price});
            toggleCart();
        }

        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('hidden'); updateCartUI(); }
        
        function updateCartUI() {
            const list = document.getElementById('cart-items');
            list.innerHTML = cart.map(i => `<div class='cart-item'>${i.name} <span>${i.price}€</span></div>`).join('');
            document.getElementById('cart-total').innerText = `Total: ${cart.reduce((a,b) => a + b.price, 0).toFixed(2)}€`;
        }

        function toggleCheckout() { document.getElementById('checkout-form-box').classList.toggle('hidden'); }

        function handleDeliveryChange() {
            const method = document.getElementById('delivery-method').value;
            document.getElementById('client-address').classList.toggle('hidden', method !== 'Entrega ao Domicilio');
        }

        function processCheckout() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const method = document.getElementById('delivery-method').value;
            const address = document.getElementById('client-address').value.trim();

            if (!name || !phone) { alert("Preencha o nome e telemóvel."); return; }
            if (method === "Entrega ao Domicilio" && !address) { alert("Indique a morada."); return; }

            let total = cart.reduce((a, b) => a + b.price, 0);
            let orderLines = cart.map(i => `▪️ ${i.name} (${i.price}€)`).join('\n');
            
            if (method === "Entrega ao Domicilio") total += HOME_DELIVERY_FEE;

            const message = `Nova Encomenda - Dream Craft\n\nDados:\n- Nome: ${name}\n- Telemóvel: ${phone}\n- Entrega: ${method}\n${address ? '- Morada: ' + address : ''}\n\nProdutos:\n${orderLines}\n\nTotal: ${total.toFixed(2)}€`;

            // Deteção de Dispositivo
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile) {
                // Abre WhatsApp no telemóvel
                window.open(`https://wa.me/${MY_PHONE_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
            } else {
                // Abre E-mail no PC
                window.location.href = `mailto:${ADMIN_EMAIL}?subject=Encomenda Dream Craft&body=${encodeURIComponent(message)}`;
            }
            
            cart = [];
            toggleCheckout();
            toggleCart();
        }

        function toggleAdminPanel() { document.getElementById('admin-panel').classList.toggle('hidden'); }
        
        function checkAdmin() {
            if (document.getElementById('admin-pass').value === "1234") {
                toggleAdminPanel();
            } else {
                failedAttempts++;
                if (failedAttempts >= 10) triggerSecurityAlert();
                alert("Password incorreta!");
            }
        }

        async function triggerSecurityAlert() {
            try {
                await fetch(`${WEB_APP_URL}?action=security_alert`, { mode: 'no-cors' });
            } catch(e) { console.error(e); }
        }

        loadCatalog();
    </script>
</body>
</html>
