<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Craft - Loja Online</title>
    <style>
        /* --- ESTILOS GERAIS E RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        /* --- CABEÇALHO --- */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        .cart-icon {
            font-size: 1.2rem;
            background: #2c3e50;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: #2c3e50;
        }

        /* --- GRELHA DE PRODUTOS (Responsiva: 1 coluna em mobile, várias em PC) --- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: #f0f0f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-price {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .btn-buy {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-buy:active {
            background-color: #1a252f;
        }

        /* --- ADAPTAÇÃO TOTAL PARA MOBILE --- */
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
            }
            .logo {
                font-size: 1.2rem;
            }
            .container {
                margin: 10px auto;
                padding: 0 10px;
            }
            .products-grid {
                grid-template-columns: 1fr; /* Uma coluna perfeita para telemóveis */
                gap: 15px;
            }
            .product-card {
                padding: 12px;
            }
            .btn-buy {
                padding: 12px; /* Área de toque maior para facilitar no dedo */
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho da Loja -->
    <header>
        <div class="logo">Dream Craft</div>
        <div class="cart-icon">🛒 Carrinho (0)</div>
    </header>

    <!-- Corpo Principal -->
    <div class="container">
        <h2>Artigos em Destaque</h2>
        
        <div class="products-grid">
            <!-- Produto 1 -->
            <div class="product-card">
                <div class="product-image">Foto Artigo</div>
                <div class="product-title">Artigo Exemplo Mulher/Criança</div>
                <div class="product-price">25,00 €</div>
                <button class="btn-buy" onclick="alert('Produto adicionado ao carrinho!')">Comprar</button>
            </div>

            <!-- Produto 2 -->
            <div class="product-card">
                <div class="product-image">Foto Artigo</div>
                <div class="product-title">Artigo Exemplo Mulher/Criança</div>
                <div class="product-price">18,50 €</div>
                <button class="btn-buy" onclick="alert('Produto adicionado ao carrinho!')">Comprar</button>
            </div>

            <!-- Produto 3 -->
            <div class="product-card">
                <div class="product-image">Foto Artigo</div>
                <div class="product-title">Artigo Exemplo Mulher/Criança</div>
                <div class="product-price">32,00 €</div>
                <button class="btn-buy" onclick="alert('Produto adicionado ao carrinho!')">Comprar</button>
            </div>
        </div>
    </div>

</body>
</html>
